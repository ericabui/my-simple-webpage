<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Counter App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'bounce-short': 'bounce 0.3s ease-in-out 1',
                        'pulse-glow': 'pulse-glow 2s infinite',
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                            '50%': { opacity: '0.85', transform: 'scale(1.02)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        .touch-action-none {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 flex flex-col justify-between">

    <!-- Top Header -->
    <header class="w-full max-w-2xl mx-auto px-4 pt-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-indigo-500/20">
                #
            </div>
            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">
                TallyCount
            </h1>
        </div>

        <div class="flex items-center gap-3">
            <!-- Sound Toggle Button -->
            <button id="soundToggleBtn" title="Toggle Sound" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition-all shadow-sm">
                <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
                <svg id="soundOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                </svg>
            </button>

            <!-- Dark Mode Toggle Button -->
            <button id="themeToggleBtn" title="Toggle Theme" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition-all shadow-sm">
                <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-xl mx-auto px-4 py-6 flex-1 flex flex-col justify-center gap-6">
        
        <!-- Counter Main Display Card -->
        <div class="relative bg-white dark:bg-slate-800 rounded-3xl p-8 border border-slate-200/80 dark:border-slate-700/60 shadow-xl shadow-slate-200/50 dark:shadow-none text-center flex flex-col items-center justify-center transition-all">
            
            <!-- Target Goal Progress Banner -->
            <div id="goalContainer" class="w-full mb-4 hidden">
                <div class="flex justify-between items-center text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 px-1">
                    <span>PROGRESS TO GOAL</span>
                    <span id="goalText">0 / 100</span>
                </div>
                <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2.5 overflow-hidden">
                    <div id="goalProgressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300 w-0"></div>
                </div>
            </div>

            <!-- Value Display -->
            <div id="counterValue" class="text-7xl sm:text-8xl font-black tracking-tight my-4 text-slate-900 dark:text-white transition-transform duration-100 transform active:scale-95 cursor-default font-mono">
                0
            </div>

            <!-- Primary Counter Controls -->
            <div class="flex items-center justify-center gap-4 w-full mt-2">
                <!-- Decrement Button -->
                <button id="decrementBtn" class="touch-action-none flex-1 max-w-[140px] h-16 sm:h-20 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/50 text-rose-600 dark:text-rose-400 rounded-2xl flex items-center justify-center font-bold text-3xl shadow-sm hover:bg-rose-100 dark:hover:bg-rose-900/60 active:scale-95 transition-all">
                    −
                </button>

                <!-- Reset Button -->
                <button id="resetBtn" title="Reset Counter (Key: R)" class="touch-action-none w-12 h-16 sm:h-20 bg-slate-100 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600/60 text-slate-500 dark:text-slate-400 rounded-2xl flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 hover:text-slate-700 dark:hover:text-slate-200 active:scale-90 transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>

                <!-- Increment Button -->
                <button id="incrementBtn" class="touch-action-none flex-1 max-w-[140px] h-16 sm:h-20 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl flex items-center justify-center font-bold text-3xl shadow-lg shadow-indigo-600/30 active:scale-95 transition-all">
                    +
                </button>
            </div>
            
            <p class="text-xs text-slate-400 dark:text-slate-500 mt-4 hidden sm:block">
                Tip: Use <kbd class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 text-[10px]">↑</kbd> / <kbd class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 text-[10px]">↓</kbd> or <kbd class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 text-[10px]">Space</kbd> on your keyboard
            </p>
        </div>

        <!-- Settings & Configuration Bar -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Step Size Config -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-700/60 shadow-sm flex flex-col justify-between">
                <label for="stepInput" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 block">
                    Step Amount
                </label>
                <div class="flex items-center gap-2">
                    <button class="stepPresetBtn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-700 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 hover:text-indigo-600 dark:hover:text-indigo-400 text-slate-600 dark:text-slate-300 transition-colors" data-step="1">1</button>
                    <button class="stepPresetBtn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-700 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 hover:text-indigo-600 dark:hover:text-indigo-400 text-slate-600 dark:text-slate-300 transition-colors" data-step="5">5</button>
                    <button class="stepPresetBtn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-700 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 hover:text-indigo-600 dark:hover:text-indigo-400 text-slate-600 dark:text-slate-300 transition-colors" data-step="10">10</button>
                    <input type="number" id="stepInput" value="1" min="1" max="1000" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1 text-sm font-semibold text-right focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-slate-200">
                </div>
            </div>

            <!-- Target Goal Config -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-700/60 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center mb-2">
                    <label for="goalInput" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider block">
                        Target Goal
                    </label>
                    <span id="goalStatusBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400">
                        OFF
                    </span>
                </div>
                <div class="flex items-center gap-2">
                    <input type="number" id="goalInput" placeholder="Set target..." min="1" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-slate-200">
                    <button id="clearGoalBtn" class="px-2.5 py-1 text-xs text-slate-400 hover:text-rose-500 transition-colors">Clear</button>
                </div>
            </div>
        </div>

        <!-- History / Log Section -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    Recent Activity
                </h2>
                <button id="clearHistoryBtn" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    Clear Log
                </button>
            </div>
            <div id="historyLog" class="flex flex-wrap gap-2 max-h-24 overflow-y-auto text-xs py-1">
                <span class="text-slate-400 dark:text-slate-500 italic text-xs">No activity logged yet.</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-2xl mx-auto px-4 py-4 text-center text-xs text-slate-400 dark:text-slate-600">
        Simple Counter Web App &bull; Built with Tailwind CSS
    </footer>

    <!-- Canvas for particle confetti celebration -->
    <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <script>
        // Application State
        let count = 0;
        let step = 1;
        let goal = null;
        let soundEnabled = true;
        let history = [];

        // DOM Elements
        const counterValueEl = document.getElementById('counterValue');
        const incrementBtn = document.getElementById('incrementBtn');
        const decrementBtn = document.getElementById('decrementBtn');
        const resetBtn = document.getElementById('resetBtn');
        const stepInput = document.getElementById('stepInput');
        const goalInput = document.getElementById('goalInput');
        const clearGoalBtn = document.getElementById('clearGoalBtn');
        const goalContainer = document.getElementById('goalContainer');
        const goalText = document.getElementById('goalText');
        const goalProgressBar = document.getElementById('goalProgressBar');
        const goalStatusBadge = document.getElementById('goalStatusBadge');
        const historyLog = document.getElementById('historyLog');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');
        const confettiCanvas = document.getElementById('confettiCanvas');

        // Web Audio API Synth Sound Generator
        let audioCtx = null;

        function playSound(freq, type = 'sine', duration = 0.08) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Audio Context fallback if blocked by browser policy
            }
        }

        // Trigger visual count bump animation
        function animateCounterChange(direction) {
            counterValueEl.classList.remove('scale-110', 'text-indigo-600', 'text-rose-600');
            void counterValueEl.offsetWidth; // Trigger reflow
            
            if (direction === 'up') {
                playSound(580, 'sine', 0.06);
            } else if (direction === 'down') {
                playSound(320, 'sine', 0.06);
            } else if (direction === 'reset') {
                playSound(220, 'triangle', 0.15);
            }
        }

        // Log entry to history
        function addHistoryLog(change, newTotal) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            history.unshift({ change, newTotal, timeStr });
            if (history.length > 15) history.pop();
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyLog.innerHTML = `<span class="text-slate-400 dark:text-slate-500 italic text-xs">No activity logged yet.</span>`;
                return;
            }

            historyLog.innerHTML = history.map(item => {
                const isPositive = item.change.startsWith('+');
                const badgeColor = isPositive 
                    ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800' 
                    : item.change === 'Reset' 
                    ? 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600'
                    : 'bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 border-rose-200 dark:border-rose-800';
                
                return `<div class="px-2.5 py-1 rounded-lg border text-[11px] font-mono flex items-center gap-1.5 ${badgeColor}">
                    <span class="font-bold">${item.change}</span>
                    <span class="opacity-60">→ ${item.newTotal}</span>
                </div>`;
            }).join('');
        }

        // Update Counter UI & Logic
        function updateCounter(newValue, actionType) {
            const prev = count;
            count = newValue;
            counterValueEl.textContent = count;

            if (actionType === 'inc') {
                animateCounterChange('up');
                addHistoryLog(`+${step}`, count);
            } else if (actionType === 'dec') {
                animateCounterChange('down');
                addHistoryLog(`-${step}`, count);
            } else if (actionType === 'reset') {
                animateCounterChange('reset');
                addHistoryLog('Reset', count);
            }

            updateGoalProgress();
        }

        // Goal Logic & Progress Bar
        function updateGoalProgress() {
            if (goal !== null && goal > 0) {
                goalContainer.classList.remove('hidden');
                goalStatusBadge.textContent = 'ACTIVE';
                goalStatusBadge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400';
                
                const percentage = Math.min(Math.max((count / goal) * 100, 0), 100);
                goalProgressBar.style.width = `${percentage}%`;
                goalText.textContent = `${count} / ${goal}`;

                if (count >= goal && count > 0) {
                    goalProgressBar.classList.add('bg-emerald-500');
                    goalProgressBar.classList.remove('bg-indigo-600');
                    triggerCelebration();
                } else {
                    goalProgressBar.classList.remove('bg-emerald-500');
                    goalProgressBar.classList.add('bg-indigo-600');
                }
            } else {
                goalContainer.classList.add('hidden');
                goalStatusBadge.textContent = 'OFF';
                goalStatusBadge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400';
            }
        }

        // Particle Confetti Effect on Goal Reached
        function triggerCelebration() {
            playSound(880, 'sine', 0.2);
            setTimeout(() => playSound(1046.5, 'sine', 0.3), 100);

            const ctx = confettiCanvas.getContext('2d');
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#3b82f6'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 12,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    alpha: 1
                });
            }

            function renderParticles() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                let active = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2; // gravity
                    p.alpha -= 0.015;

                    if (p.alpha > 0) {
                        active = true;
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.alpha;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                if (active) {
                    requestAnimationFrame(renderParticles);
                } else {
                    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                }
            }

            renderParticles();
        }

        // Event Listeners - Core Buttons
        incrementBtn.addEventListener('click', () => updateCounter(count + step, 'inc'));
        decrementBtn.addEventListener('click', () => updateCounter(count - step, 'dec'));
        resetBtn.addEventListener('click', () => updateCounter(0, 'reset'));

        // Step inputs
        stepInput.addEventListener('change', (e) => {
            const val = parseInt(e.target.value, 10);
            step = isNaN(val) || val < 1 ? 1 : val;
            stepInput.value = step;
        });

        document.querySelectorAll('.stepPresetBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                step = parseInt(btn.dataset.step, 10);
                stepInput.value = step;
                playSound(400, 'sine', 0.04);
            });
        });

        // Goal inputs
        goalInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            goal = isNaN(val) || val <= 0 ? null : val;
            updateGoalProgress();
        });

        clearGoalBtn.addEventListener('click', () => {
            goalInput.value = '';
            goal = null;
            updateGoalProgress();
        });

        // Clear History
        clearHistoryBtn.addEventListener('click', () => {
            history = [];
            renderHistory();
        });

        // Sound Toggle
        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundOnIcon.classList.toggle('hidden', !soundEnabled);
            soundOffIcon.classList.toggle('hidden', soundEnabled);
        });

        // Dark / Light Theme Toggle
        function setTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
                localStorage.setItem('theme', 'light');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');
            setTheme(!isDark);
        });

        // System theme preference setup
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            setTheme(true);
        } else {
            setTheme(false);
        }

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            // Ignore keypresses if focusing input elements
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

            if (e.key === 'ArrowUp' || e.key === '+' || e.key === ' ') {
                e.preventDefault();
                updateCounter(count + step, 'inc');
            } else if (e.key === 'ArrowDown' || e.key === '-') {
                e.preventDefault();
                updateCounter(count - step, 'dec');
            } else if (e.key.toLowerCase() === 'r') {
                e.preventDefault();
                updateCounter(0, 'reset');
            }
        });
    </script>
</body>
</html>
